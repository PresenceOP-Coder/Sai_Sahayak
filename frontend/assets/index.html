<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    /* Keep video in DOM (1px, opacity 0) instead of display:none so Android Chromium never suspends decoding */
    video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }
    canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    /* 1px spinner workaround for Android WebView compositor freeze bug */
    .keep-alive {
      position: absolute;
      width: 1px;
      height: 1px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="keep-alive"></div>
<!-- CRITICAL: muted + autoplay + playsinline prevents Android TTS from pausing the camera stream -->
<video id="webcam" autoplay muted playsinline></video>
<canvas id="output" width="640" height="480"></canvas>

<script>
  const videoEl = document.getElementById('webcam');
  const canvasEl = document.getElementById('output');
  const ctx = canvasEl.getContext('2d');

  let lastGesture = null;
  let holdStart = 0;
  let spokenForCurrentHold = false;
  const HOLD_MS = 1000;

  let lastSentPhrase = "";
  let lastSentProgress = -1;

  function classify(lm) {
    const tips = [8, 12, 16, 20];
    const pips = [6, 10, 14, 18];
    const f = tips.map((t, i) => lm[t].y < lm[pips[i]].y ? 1 : 0);

    const thumbOpen = Math.hypot(lm[4].x - lm[17].x, lm[4].y - lm[17].y) >
                      Math.hypot(lm[3].x - lm[17].x, lm[3].y - lm[17].y) * 1.05;

    const eq = (a, b) => a.every((v, i) => v === b[i]);

    if (eq(f, [1, 1, 1, 1]) && thumbOpen)  return "Hello! Nice to meet you.";
    if (eq(f, [1, 1, 1, 1]) && !thumbOpen) return "Can you please help me?";
    if (eq(f, [0, 0, 0, 0]) && !thumbOpen) return "Yes, I agree.";
    if (eq(f, [0, 0, 0, 0]) && thumbOpen)  return "Everything is good.";
    if (eq(f, [1, 0, 0, 0]) && !thumbOpen) return "Excuse me, I have a question.";
    if (eq(f, [1, 0, 0, 0]) && thumbOpen)  return "Wait a moment, please.";
    if (eq(f, [1, 1, 0, 0]) && !thumbOpen) return "Thank you very much.";
    if (eq(f, [1, 1, 0, 0]) && thumbOpen)  return "Where is the nearest exit?";
    if (eq(f, [1, 1, 1, 0]) && !thumbOpen) return "Water, please.";
    if (eq(f, [1, 1, 1, 0]) && thumbOpen)  return "I am feeling hungry.";
    if (eq(f, [0, 1, 1, 1]))               return "Okay, I understand.";
    if (eq(f, [1, 0, 0, 1]) && thumbOpen)  return "I love you.";
    if (eq(f, [1, 0, 0, 1]) && !thumbOpen) return "No, thank you.";
    if (eq(f, [0, 0, 0, 1]) && thumbOpen)  return "Please call or text me.";
    if (eq(f, [0, 0, 0, 1]) && !thumbOpen) return "Where is the restroom?";

    return null;
  }

  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7
  });

  hands.onResults((results) => {
    ctx.save();
    ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);

    let currentGesture = null;
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const lm = results.multiHandLandmarks[0];
      drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 4 });
      drawLandmarks(ctx, lm, { color: '#FF0000', lineWidth: 2 });
      currentGesture = classify(lm);
    }
    ctx.restore();

    const now = performance.now();
    let progress = 0.0;
    let shouldSpeak = false;

    if (currentGesture && currentGesture === lastGesture) {
      const elapsed = now - holdStart;
      progress = Math.min(elapsed / HOLD_MS, 1.0);
      // Fire shouldSpeak ONCE when reaching 100%, not on every frame after 100%
      if (elapsed >= HOLD_MS && !spokenForCurrentHold) {
        shouldSpeak = true;
        spokenForCurrentHold = true;
      }
    } else {
      lastGesture = currentGesture;
      holdStart = now;
      spokenForCurrentHold = false;
    }

    const phraseStr = currentGesture || "";
    const roundedProgress = Math.round(progress * 20) / 20; // Step by 5% to avoid flooding Flutter bridge

    if (
      window.flutter_inappwebview &&
      (shouldSpeak || phraseStr !== lastSentPhrase || roundedProgress !== lastSentProgress)
    ) {
      lastSentPhrase = phraseStr;
      lastSentProgress = roundedProgress;
      window.flutter_inappwebview.callHandler('onSignDetected', phraseStr, shouldSpeak, roundedProgress);
    }
  });

  // Self-healing camera loop (replaces @mediapipe/camera_utils so it never freezes on TTS)
  let isProcessing = false;

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    videoEl.srcObject = stream;
    await videoEl.play();
    requestAnimationFrame(processFrame);
  }

  async function processFrame() {
    // If Android paused the video when Flutter TTS spoke, immediately resume it
    if (videoEl.paused && videoEl.srcObject) {
      videoEl.play().catch(() => {});
    }

    if (videoEl.readyState >= 2 && !isProcessing) {
      isProcessing = true;
      try {
        await hands.send({ image: videoEl });
      } catch (e) {
        console.error(e);
      }
      isProcessing = false;
    }
    requestAnimationFrame(processFrame);
  }

  startCamera();
</script>
</body>
</html>
